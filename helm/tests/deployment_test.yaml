suite: Deployment scheduling
templates:
  - deployment.yaml
tests:
  - it: should omit optional scheduling and rollout fields by default
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
      - notExists:
          path: spec.strategy

  - it: should render revision-scoped topology spread constraints
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: robotlb
              app.kubernetes.io/instance: RELEASE-NAME
          matchLabelKeys:
            - pod-template-hash
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0]
          value:
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: robotlb
                app.kubernetes.io/instance: RELEASE-NAME
            matchLabelKeys:
              - pod-template-hash

  - it: should preserve multiple spread constraints alongside affinity
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 2
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 10

  - it: should render a temporary delete-first rollout strategy for migration
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
